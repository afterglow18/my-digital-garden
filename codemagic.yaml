workflows:
  ios-release:
    name: My Digital Garden — iOS Release
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalgarden.app
      groups:
        - apple_credentials
      vars:
        XCODE_WORKSPACE: "artifacts/outfit-generator/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        COREPACK_ENABLE_STRICT: "0"
      node: 22.12.0
    scripts:
      - name: Set up pnpm
        script: |
          npm install -g pnpm --force

      - name: Install JS dependencies
        script: |
          cd artifacts/outfit-generator
          pnpm install

      - name: Build web assets
        script: |
          cd artifacts/outfit-generator
          pnpm exec vite build --config vite.capacitor.config.ts

      - name: Add and sync iOS platform (CocoaPods)
        script: |
          cd artifacts/outfit-generator
          rm -rf ios
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
          if [ ! -f ios/App/Podfile ]; then
            echo "❌ Podfile not found after cap add ios — aborting"
            exit 1
          fi
          cd ios/App
          pod install --repo-update

      - name: Inject Info.plist privacy keys via PlistBuddy
        script: |
          PLIST="artifacts/outfit-generator/ios/App/App/Info.plist"
          add_or_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }
          add_or_set NSCameraUsageDescription \
            "My Garden uses the camera so you can photograph items to add to your garden."
          add_or_set NSPhotoLibraryUsageDescription \
            "My Garden reads your photo library so you can pick existing photos to add to your garden."
          add_or_set NSPhotoLibraryAddUsageDescription \
            "My Garden saves captured photos to your photo library."
          add_or_set ITSAppUsesNonExemptEncryption "false"
          echo "✅ Info.plist keys injected"

      - name: Set build number
        script: |
          cd artifacts/outfit-generator/ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-build-number \
            --app-id 6792341908 --platform IOS 2>/dev/null || echo 0) + 1))
        ignore_failure: true

      - name: Apply code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build and archive
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Publish to TestFlight
        script: |
          app-store-connect publish \
            --path "$(find build/ios/ipa -name '*.ipa' | head -1)" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY \
            --submit-to-testflight

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

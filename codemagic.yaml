workflows:
  ios-release:
    name: My Digital Garden — iOS Release
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalgarden.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20.17.0
    scripts:
      - name: Install pnpm
        script: npm install -g pnpm

      - name: Install dependencies
        script: |
          cd artifacts/outfit-generator
          pnpm install

      - name: Build web assets
        script: |
          cd artifacts/outfit-generator
          pnpm run build:ios

      - name: Capacitor sync
        script: |
          cd artifacts/outfit-generator
          npx cap sync ios

      - name: Patch Info.plist privacy keys
        script: |
          cd artifacts/outfit-generator
          node scripts/patch-info-plist.mjs

      - name: Set build number
        script: |
          cd artifacts/outfit-generator
          agvtool new-version -all $(($(app-store-connect get-latest-build-number \
            --app-id 6792341908 --platform IOS 2>/dev/null || echo 0) + 1))
        ignore_failure: true

      - name: Build and archive
        script: |
          cd artifacts/outfit-generator
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - artifacts/outfit-generator/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

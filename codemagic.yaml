workflows:
  ios-release:
    name: My Digital Garden — iOS Release
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalgarden.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        COREPACK_ENABLE_STRICT: "0"
      node: 20.17.0
    scripts:
      - name: Set up pnpm
        script: |
          npm install -g pnpm --force

      - name: Install dependencies
        script: |
          cd artifacts/outfit-generator
          pnpm install

      - name: Build web assets
        script: |
          cd artifacts/outfit-generator
          pnpm run build:ios

      - name: Capacitor sync
        script: |
          cd artifacts/outfit-generator
          npx cap sync ios

      - name: Inject Info.plist privacy keys via PlistBuddy
        script: |
          PLIST="artifacts/outfit-generator/ios/App/App/Info.plist"
          add_or_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }
          add_or_set NSCameraUsageDescription \
            "My Garden uses the camera so you can photograph items to add to your garden."
          add_or_set NSPhotoLibraryUsageDescription \
            "My Garden reads your photo library so you can pick existing photos to add to your garden."
          add_or_set NSPhotoLibraryAddUsageDescription \
            "My Garden saves captured photos to your photo library."
          add_or_set NSFaceIDUsageDescription \
            "My Garden uses Face ID to keep your garden private."
          add_or_set ITSAppUsesNonExemptEncryption "false"
          echo "✅ Info.plist keys injected"

      - name: Set build number
        script: |
          cd artifacts/outfit-generator
          agvtool new-version -all $(($(app-store-connect get-latest-build-number \
            --app-id 6792341908 --platform IOS 2>/dev/null || echo 0) + 1))
        ignore_failure: true

      - name: Build and archive
        script: |
          cd artifacts/outfit-generator
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - artifacts/outfit-generator/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
